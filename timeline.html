<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Timeline — Our Little Universe</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .timeline-page {
            min-height: 100vh;
            padding: 120px 20px 80px;
        }

        .timeline-header {
            text-align: center;
            margin-bottom: 70px;
        }

        .timeline-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .timeline-header p {
            color: #aaa;
            font-size: 16px;
        }

        .timeline {
            position: relative;
            max-width: 850px;
            margin: 0 auto;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(
                to bottom,
                transparent,
                rgba(140, 120, 220, 0.7),
                transparent
            );
            transform: translateX(-50%);
        }

        .timeline-item {
            position: relative;
            width: 50%;
            padding: 0 40px 60px;
            box-sizing: border-box;
        }

        .timeline-item:nth-child(odd) {
            left: 0;
            text-align: right;
        }

        .timeline-item:nth-child(even) {
            left: 50%;
            text-align: left;
        }

        .timeline-dot {
            position: absolute;
            top: 5px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #9b8cff;
            box-shadow:
                0 0 0 5px rgba(155, 140, 255, 0.12),
                0 0 20px rgba(155, 140, 255, 0.5);
        }

        .timeline-item:nth-child(odd) .timeline-dot {
            right: -7px;
        }

        .timeline-item:nth-child(even) .timeline-dot {
            left: -7px;
        }

        .timeline-card {
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 18px;
            cursor: pointer;
            transition: 0.25s ease;
            backdrop-filter: blur(10px);
        }

        .timeline-card:hover {
            transform: translateY(-4px);
            border-color: rgba(155, 140, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .timeline-card img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 14px;
        }

        .timeline-date {
            font-size: 12px;
            letter-spacing: 1px;
            color: #9d91ff;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .timeline-title {
            font-size: 20px;
            margin: 0 0 8px;
        }

        .timeline-location {
            color: #aaa;
            font-size: 13px;
        }

        .timeline-empty {
            text-align: center;
            color: #aaa;
            padding: 60px 20px;
        }

        @media (max-width: 700px) {

            .timeline-page {
                padding-top: 100px;
            }

            .timeline-header h1 {
                font-size: 32px;
            }

            .timeline::before {
                left: 10px;
            }

            .timeline-item,
            .timeline-item:nth-child(even),
            .timeline-item:nth-child(odd) {
                width: 100%;
                left: 0;
                text-align: left;
                padding-left: 40px;
                padding-right: 0;
            }

            .timeline-item:nth-child(odd) .timeline-dot,
            .timeline-item:nth-child(even) .timeline-dot {
                left: 3px;
                right: auto;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            Our Little Universe ✦
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="memories.html">Memories</a>
            <a href="timeline.html" class="active">Timeline</a>
        </div>

    </nav>


    <!-- TIMELINE -->
    <main class="timeline-page">

        <header class="timeline-header">

            <h1>
                Our Timeline ✦
            </h1>

            <p>
                little moments that became our story
            </p>

        </header>


        <section
            id="timelineContainer"
            class="timeline"
        >

            <div class="timeline-empty">
                Loading our story...
            </div>

        </section>

    </main>


    <!-- SCRIPTS -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="auth.js"></script>


    <script>

        const timelineContainer =
            document.getElementById(
                "timelineContainer"
            );


        // =============================================
        // LOAD TIMELINE
        // =============================================

        async function loadTimeline() {

            const {
                data,
                error
            } = await supabaseClient.rpc(
                "get_my_memories"
            );


            if (error) {

                console.error(
                    "Timeline error:",
                    error
                );

                timelineContainer.innerHTML = `
                    <div class="timeline-empty">
                        Failed to load our timeline.
                    </div>
                `;

                return;
            }


            if (!data || data.length === 0) {

                timelineContainer.innerHTML = `
                    <div class="timeline-empty">
                        No memories yet ✦
                    </div>
                `;

                return;
            }


            // =========================================
            // SORT OLDEST → NEWEST
            // =========================================

            data.sort((a, b) => {

                if (!a.memory_date) return 1;

                if (!b.memory_date) return -1;

                return new Date(a.memory_date)
                    - new Date(b.memory_date);

            });


            timelineContainer.innerHTML = "";


            // =========================================
            // CREATE ITEMS
            // =========================================

            for (const memory of data) {

                let imageUrl = "";


                const {
                    data: photos,
                    error: photoError
                } = await supabaseClient
                    .from("memory_photos")
                    .select("*")
                    .eq(
                        "memory_id",
                        memory.id
                    )
                    .order(
                        "display_order",
                        {
                            ascending: true
                        }
                    )
                    .limit(1);


                if (photoError) {

                    console.error(
                        "Timeline photo error:",
                        photoError
                    );

                }


                if (
                    photos &&
                    photos.length > 0
                ) {

                    const {
                        data: signedUrlData,
                        error: signedUrlError
                    } = await supabaseClient
                        .storage
                        .from("memory-photos")
                        .createSignedUrl(
                            photos[0].file_path,
                            60 * 60
                        );


                    if (
                        !signedUrlError &&
                        signedUrlData
                    ) {

                        imageUrl =
                            signedUrlData.signedUrl;

                    }
                }


                createTimelineItem(
                    memory,
                    imageUrl
                );
            }
        }


        // =============================================
        // CREATE TIMELINE ITEM
        // =============================================

        function createTimelineItem(
            memory,
            imageUrl
        ) {

            const item =
                document.createElement(
                    "article"
                );


            item.className =
                "timeline-item";


            const date =
                formatDate(
                    memory.memory_date
                );


            item.innerHTML = `

                <div class="timeline-dot"></div>

                <div class="timeline-card">

                    ${
                        imageUrl
                        ? `
                            <img
                                src="${imageUrl}"
                                alt="${escapeHTML(memory.title)}"
                            >
                        `
                        : ""
                    }

                    <div class="timeline-date">
                        ${date}
                    </div>

                    <h2 class="timeline-title">
                        ${escapeHTML(memory.title)}
                    </h2>

                    ${
                        memory.location
                        ? `
                            <div class="timeline-location">
                                📍 ${escapeHTML(memory.location)}
                            </div>
                        `
                        : ""
                    }

                </div>
            `;


            // =========================================
            // CLICK → MEMORY DETAIL
            // =========================================

            item
                .querySelector(".timeline-card")
                .addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            `memories.html?memory=${memory.id}`;

                    }
                );


            timelineContainer.appendChild(
                item
            );
        }


        // =============================================
        // DATE
        // =============================================

        function formatDate(dateString) {

            if (!dateString) {
                return "DATE UNKNOWN";
            }


            const date =
                new Date(
                    `${dateString}T00:00:00`
                );


            return date.toLocaleDateString(
                "en-US",
                {
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                }
            ).toUpperCase();
        }


        // =============================================
        // SECURITY
        // =============================================

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }


            return String(value)
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );
        }


        // =============================================
        // START
        // =============================================

        loadTimeline();

    </script>

</body>
</html>
