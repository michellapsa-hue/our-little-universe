<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Our Timeline — Our Little Universe
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =========================================
           PAGE
        ========================================= */

        .timeline-page {
            min-height: 100vh;

            padding:
                120px
                20px
                80px;
        }


        .timeline-header {
            text-align: center;

            margin-bottom: 70px;
        }


        .timeline-header h1 {
            font-size: 42px;

            margin-bottom: 10px;
        }


        .timeline-header p {
            color: #aaa;
        }


        /* =========================================
           TIMELINE
        ========================================= */

        .timeline {
            position: relative;

            max-width: 900px;

            margin: 0 auto;
        }


        .timeline::before {
            content: "";

            position: absolute;

            top: 0;
            bottom: 0;

            left: 50%;

            width: 2px;

            transform:
                translateX(-50%);

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(
                        145,
                        130,
                        230,
                        0.7
                    ),
                    transparent
                );
        }


        /* =========================================
           ITEM
        ========================================= */

        .timeline-item {
            position: relative;

            width: 50%;

            padding:
                0
                45px
                65px;

            box-sizing: border-box;
        }


        .timeline-item:nth-child(odd) {
            left: 0;

            text-align: right;
        }


        .timeline-item:nth-child(even) {
            left: 50%;

            text-align: left;
        }


        /* =========================================
           DOT
        ========================================= */

        .timeline-dot {
            position: absolute;

            top: 6px;

            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: #9589e9;

            box-shadow:
                0 0 0 5px
                rgba(
                    149,
                    137,
                    233,
                    0.12
                ),

                0 0 20px
                rgba(
                    149,
                    137,
                    233,
                    0.5
                );
        }


        .timeline-item:nth-child(odd)
        .timeline-dot {

            right: -7px;
        }


        .timeline-item:nth-child(even)
        .timeline-dot {

            left: -7px;
        }


        /* =========================================
           CARD
        ========================================= */

        .timeline-card {
            overflow: hidden;

            padding: 18px;

            border-radius: 22px;

            background: rgba(
                255,
                255,
                255,
                0.055
            );

            border: 1px solid rgba(
                255,
                255,
                255,
                0.1
            );

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition: 0.25s ease;
        }


        .timeline-card:hover {

            transform:
                translateY(-4px);

            border-color: rgba(
                145,
                130,
                230,
                0.4
            );
        }


        .timeline-card-image {

            display: block;

            width: 100%;

            max-height: 230px;

            object-fit: cover;

            border-radius: 15px;

            margin-bottom: 15px;
        }


        .timeline-date {

            color: #9589e9;

            font-size: 12px;

            letter-spacing: 1.4px;

            margin-bottom: 8px;
        }


        .timeline-title {

            margin: 0 0 8px;

            font-family:
                Georgia,
                serif;

            font-size: 23px;
        }


        .timeline-location {

            color: #999;

            font-size: 13px;
        }


        .timeline-empty {

            text-align: center;

            color: #aaa;

            padding: 60px 20px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .timeline-page {

                padding-top: 100px;
            }


            .timeline-header h1 {

                font-size: 34px;
            }


            .timeline::before {

                left: 10px;
            }


            .timeline-item,
            .timeline-item:nth-child(odd),
            .timeline-item:nth-child(even) {

                width: 100%;

                left: 0;

                text-align: left;

                padding-left: 40px;

                padding-right: 0;
            }


            .timeline-item:nth-child(odd)
            .timeline-dot,

            .timeline-item:nth-child(even)
            .timeline-dot {

                left: 3px;

                right: auto;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">
            Our Little Universe ✦
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="memories.html">
                Memories
            </a>

            <a
                href="timeline.html"
                class="active"
            >
                Timeline
            </a>

            <a href="letters.html">
                Letters
            </a>

        </div>


        <button
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </nav>



    <!-- =========================================
         TIMELINE PAGE
    ========================================= -->

    <main class="timeline-page">


        <header class="timeline-header">

            <h1>
                Our Timeline ✦
            </h1>

            <p>
                little moments that became our story
            </p>

        </header>



        <section
            id="timelineContainer"
            class="timeline"
        >

            <div class="timeline-empty">
                Loading our story...
            </div>

        </section>


    </main>



    <!-- =========================================
         SUPABASE
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="auth.js"></script>



    <!-- =========================================
         TIMELINE SCRIPT
    ========================================= -->

    <script>

        const timelineContainer =
            document.getElementById(
                "timelineContainer"
            );


        // =========================================
        // LOAD TIMELINE
        // =========================================

        async function loadTimeline() {

            timelineContainer.innerHTML = `
                <div class="timeline-empty">
                    Loading our story...
                </div>
            `;


            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "get_my_memories"
                );


            if (error) {

                console.error(
                    "Timeline error:",
                    error
                );


                timelineContainer.innerHTML = `
                    <div class="timeline-empty">
                        Failed to load our timeline.
                    </div>
                `;


                return;
            }


            if (
                !data ||
                data.length === 0
            ) {

                timelineContainer.innerHTML = `
                    <div class="timeline-empty">
                        No memories yet ✦
                    </div>
                `;


                return;
            }


            // =====================================
            // SORT OLDEST → NEWEST
            // =====================================

            data.sort(
                (a, b) => {

                    if (!a.memory_date) {
                        return 1;
                    }

                    if (!b.memory_date) {
                        return -1;
                    }

                    return new Date(
                        a.memory_date
                    )
                    -
                    new Date(
                        b.memory_date
                    );

                }
            );


            timelineContainer.innerHTML = "";


            // =====================================
            // CREATE TIMELINE
            // =====================================

            for (
                const memory of data
            ) {

                const imageUrl =
                    await getTimelineImage(
                        memory.id
                    );


                createTimelineItem(
                    memory,
                    imageUrl
                );
            }
        }


        // =========================================
        // GET PHOTO
        // =========================================

        async function getTimelineImage(
            memoryId
        ) {

            const {
                data: photos,
                error
            } =
                await supabaseClient
                    .from(
                        "memory_photos"
                    )
                    .select("*")
                    .eq(
                        "memory_id",
                        memoryId
                    )
                    .order(
                        "display_order",
                        {
                            ascending: true
                        }
                    )
                    .limit(1);


            if (error) {

                console.error(
                    "Timeline photo error:",
                    error
                );

                return "";
            }


            if (
                !photos ||
                photos.length === 0
            ) {

                return "";
            }


            const {
                data,
                error:
                    signedError
            } =
                await supabaseClient
                    .storage
                    .from(
                        "memory-photos"
                    )
                    .createSignedUrl(
                        photos[0].file_path,
                        60 * 60
                    );


            if (
                signedError ||
                !data
            ) {

                return "";
            }


            return data.signedUrl;
        }


        // =========================================
        // CREATE ITEM
        // =========================================

        function createTimelineItem(
            memory,
            imageUrl
        ) {

            const item =
                document.createElement(
                    "article"
                );


            item.className =
                "timeline-item";


            item.innerHTML = `

                <div class="timeline-dot"></div>

                <div class="timeline-card">

                    ${
                        imageUrl
                        ? `
                            <img
                                src="${imageUrl}"
                                class="timeline-card-image"
                                alt="${escapeHTML(
                                    memory.title
                                )}"
                            >
                        `
                        : ""
                    }

                    <div class="timeline-date">
                        ${formatDate(
                            memory.memory_date
                        )}
                    </div>

                    <h2 class="timeline-title">
                        ${escapeHTML(
                            memory.title
                        )}
                    </h2>

                    ${
                        memory.location
                        ? `
                            <div class="timeline-location">
                                📍 ${escapeHTML(
                                    memory.location
                                )}
                            </div>
                        `
                        : ""
                    }

                </div>
            `;


            // =====================================
            // CLICK → MEMORIES
            // =====================================

            item
                .querySelector(
                    ".timeline-card"
                )
                .addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            "memories.html";

                    }
                );


            timelineContainer.appendChild(
                item
            );
        }


        // =========================================
        // DATE
        // =========================================

        function formatDate(
            dateString
        ) {

            if (!dateString) {

                return "DATE UNKNOWN";
            }


            const date =
                new Date(
                    `${dateString}T00:00:00`
                );


            return date.toLocaleDateString(
                "en-US",
                {
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                }
            ).toUpperCase();
        }


        // =========================================
        // SECURITY
        // =========================================

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";
            }


            return String(value)
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );
        }


        // =========================================
        // START
        // =========================================

        loadTimeline();

    </script>


</body>

</html>
