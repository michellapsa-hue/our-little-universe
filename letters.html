<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Letters — Our Little Universe</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .letters-page {
            min-height: 100vh;
            padding: 120px 20px 80px;
        }

        .letters-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .letters-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .letters-header p {
            color: #aaa;
        }

        .letter-create-button {
            display: block;
            margin: 0 auto 50px;

            border: none;
            padding: 13px 24px;
            border-radius: 999px;

            background: linear-gradient(
                135deg,
                #7770dc,
                #966bd0
            );

            color: white;
            font-weight: 600;
            cursor: pointer;

            transition: 0.2s ease;
        }

        .letter-create-button:hover {
            transform: translateY(-2px);
        }

        .letters-container {
            max-width: 900px;
            margin: auto;

            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 24px;
        }

        .letter-card {
            position: relative;

            padding: 26px;

            border-radius: 22px;

            background: rgba(
                255,
                255,
                255,
                0.055
            );

            border: 1px solid rgba(
                255,
                255,
                255,
                0.1
            );

            backdrop-filter: blur(12px);

            cursor: pointer;

            transition: 0.25s ease;
        }

        .letter-card:hover {
            transform: translateY(-4px);

            border-color: rgba(
                155,
                140,
                255,
                0.4
            );
        }

        .letter-envelope {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .letter-to {
            font-size: 12px;
            color: #9d91ff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .letter-title {
            font-size: 21px;
            margin: 8px 0;
        }

        .letter-preview {
            color: #bbb;
            line-height: 1.6;

            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .letter-from {
            margin-top: 18px;

            color: #888;
            font-size: 13px;
        }

        .letters-empty {
            grid-column: 1 / -1;

            text-align: center;
            color: #aaa;
            padding: 60px 20px;
        }


        /* ==========================================
           MODAL
        ========================================== */

        .letter-modal {
            position: fixed;
            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(
                5,
                5,
                20,
                0.78
            );

            backdrop-filter: blur(8px);

            z-index: 999;
        }

        .letter-modal.active {
            display: flex;
        }

        .letter-box {
            position: relative;

            width: min(
                600px,
                100%
            );

            max-height: 90vh;
            overflow-y: auto;

            padding: 32px;

            border-radius: 24px;

            background: #17162d;

            border: 1px solid rgba(
                255,
                255,
                255,
                0.12
            );

            box-shadow:
                0 25px 80px rgba(
                    0,
                    0,
                    0,
                    0.45
                );
        }

        .letter-close {
            position: absolute;

            top: 15px;
            right: 18px;

            border: none;
            background: none;

            color: #aaa;

            font-size: 28px;
            cursor: pointer;
        }

        .letter-box h2 {
            margin-top: 0;
        }

        .letter-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .letter-form label {
            margin-top: 8px;

            font-size: 13px;
            color: #aaa;
        }

        .letter-form input,
        .letter-form select,
        .letter-form textarea {

            width: 100%;
            box-sizing: border-box;

            padding: 12px 14px;

            border-radius: 10px;

            border: 1px solid rgba(
                255,
                255,
                255,
                0.12
            );

            background: rgba(
                255,
                255,
                255,
                0.05
            );

            color: white;

            font-family: inherit;

            outline: none;
        }

        .letter-form select option {
            background: #17162d;
            color: white;
        }

        .letter-form textarea {
            resize: vertical;
            min-height: 180px;
        }

        .letter-save-button {
            margin-top: 15px;

            border: none;

            padding: 13px 20px;

            border-radius: 999px;

            background: linear-gradient(
                135deg,
                #7770dc,
                #966bd0
            );

            color: white;

            font-weight: 600;

            cursor: pointer;
        }

        .letter-detail-content {
            white-space: pre-wrap;

            line-height: 1.9;

            color: #ddd;

            margin-top: 25px;
        }

        .letter-detail-meta {
            color: #9d91ff;
            font-size: 13px;
            margin-top: 8px;
        }


        @media (max-width: 700px) {

            .letters-page {
                padding-top: 100px;
            }

            .letters-header h1 {
                font-size: 32px;
            }

            .letters-container {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

    <!-- ==========================================
         NAVBAR
    ========================================== -->

    <nav class="navbar">

        <div class="logo">
            Our Little Universe ✦
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="memories.html">
                Memories
            </a>

            <a href="timeline.html">
                Timeline
            </a>

            <a href="letters.html"
               class="active">
                Letters
            </a>

        </div>

    </nav>


    <!-- ==========================================
         PAGE
    ========================================== -->

    <main class="letters-page">

        <header class="letters-header">

            <h1>
                Our Letters 💌
            </h1>

            <p>
                little words we don't always say out loud
            </p>

        </header>


        <button
            id="createLetterButton"
            class="letter-create-button"
        >
            ✦ Write a Letter
        </button>


        <section
            id="lettersContainer"
            class="letters-container"
        >

            <div class="letters-empty">
                Loading our letters...
            </div>

        </section>

    </main>


    <!-- ==========================================
         WRITE LETTER MODAL
    ========================================== -->

    <div
        id="letterModal"
        class="letter-modal"
    >

        <div class="letter-box">

            <button
                id="closeLetterModal"
                class="letter-close"
            >
                ×
            </button>


            <h2>
                Write a Letter 💌
            </h2>


            <form
                id="letterForm"
                class="letter-form"
            >

                <label>
                    To
                </label>

                <select
                    id="letterRecipient"
                    required
                >
                    <option value="">
                        Choose someone...
                    </option>
                </select>


                <label>
                    Title
                </label>

                <input
                    type="text"
                    id="letterTitle"
                    placeholder="A little letter for you..."
                    required
                >


                <label>
                    Your letter
                </label>

                <textarea
                    id="letterContent"
                    placeholder="Write everything you want to say..."
                    required
                ></textarea>


                <button
                    type="submit"
                    class="letter-save-button"
                >
                    Save Letter ✦
                </button>

            </form>

        </div>

    </div>


    <!-- ==========================================
         DETAIL LETTER MODAL
    ========================================== -->

    <div
        id="letterDetailModal"
        class="letter-modal"
    >

        <div class="letter-box">

            <button
                id="closeLetterDetail"
                class="letter-close"
            >
                ×
            </button>

            <div
                id="letterDetailContent"
            ></div>

        </div>

    </div>


    <!-- ==========================================
         SUPABASE
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="auth.js"></script>


    <!-- ==========================================
         LETTER SCRIPT
    ========================================== -->

    <script>

        const lettersContainer =
            document.getElementById(
                "lettersContainer"
            );

        const createLetterButton =
            document.getElementById(
                "createLetterButton"
            );

        const letterModal =
            document.getElementById(
                "letterModal"
            );

        const closeLetterModal =
            document.getElementById(
                "closeLetterModal"
            );

        const letterForm =
            document.getElementById(
                "letterForm"
            );

        const letterRecipient =
            document.getElementById(
                "letterRecipient"
            );

        const letterTitle =
            document.getElementById(
                "letterTitle"
            );

        const letterContent =
            document.getElementById(
                "letterContent"
            );

        const letterDetailModal =
            document.getElementById(
                "letterDetailModal"
            );

        const closeLetterDetail =
            document.getElementById(
                "closeLetterDetail"
            );

        const letterDetailContent =
            document.getElementById(
                "letterDetailContent"
            );


        let currentUser = null;


        // ==========================================
        // GET CURRENT USER
        // ==========================================

        async function getCurrentUser() {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient
                    .auth
                    .getUser();


            currentUser = user;

            return user;
        }


        // ==========================================
        // LOAD MEMBERS
        // ==========================================

        async function loadMembers() {

            if (!currentUser) {
                return;
            }


            const {
                data,
                error
            } = await supabaseClient
                .from("universe_members")
                .select("user_id")
                .eq(
                    "universe_id",
                    "e6df9aea-780d-4784-a4ef-12710647444d"
                );


            if (error) {

                console.error(
                    "Members error:",
                    error
                );

                return;
            }


            letterRecipient.innerHTML = `
                <option value="">
                    Choose someone...
                </option>
            `;


            for (const member of data) {

                if (
                    member.user_id ===
                    currentUser.id
                ) {
                    continue;
                }


                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    member.user_id;

                option.textContent =
                    getPersonName(
                        member.user_id
                    );

                letterRecipient.appendChild(
                    option
                );
            }
        }


        // ==========================================
        // PERSON NAME
        // ==========================================

        function getPersonName(userId) {

            if (
                userId ===
                "81cb9fd4-d4e4-40ae-93f2-f78e8054e34e"
            ) {

                return "Mey 💜";

            }


            if (
                userId ===
                "b6e48bbd-6547-4df3-a2d4-468507a78994"
            ) {

                return "Ian 💙";

            }


            return "My favorite person ✦";
        }


        // ==========================================
        // LOAD LETTERS
        // ==========================================

        async function loadLetters() {

            const {
                data,
                error
            } = await supabaseClient
                .from("letters")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Letters error:",
                    error
                );

                lettersContainer.innerHTML = `
                    <div class="letters-empty">
                        Failed to load our letters.
                    </div>
                `;

                return;
            }


            if (
                !data ||
                data.length === 0
            ) {

                lettersContainer.innerHTML = `
                    <div class="letters-empty">
                        No letters yet 💌
                    </div>
                `;

                return;
            }


            lettersContainer.innerHTML = "";


            data.forEach(
                createLetterCard
            );
        }


        // ==========================================
        // CREATE LETTER CARD
        // ==========================================

        function createLetterCard(letter) {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "letter-card";


            card.innerHTML = `

                <div class="letter-envelope">
                    💌
                </div>

                <div class="letter-to">
                    To ${escapeHTML(
                        getPersonName(
                            letter.recipient_id
                        )
                    )}
                </div>

                <h2 class="letter-title">
                    ${escapeHTML(
                        letter.title
                    )}
                </h2>

                <div class="letter-preview">
                    ${escapeHTML(
                        letter.content
                    )}
                </div>

                <div class="letter-from">
                    — ${escapeHTML(
                        getPersonName(
                            letter.sender_id
                        )
                    )}
                </div>
            `;


            card.addEventListener(
                "click",
                () => {

                    showLetterDetail(
                        letter
                    );

                }
            );


            lettersContainer.appendChild(
                card
            );
        }


        // ==========================================
        // DETAIL
        // ==========================================

        function showLetterDetail(letter) {

            letterDetailContent.innerHTML = `

                <div class="letter-envelope">
                    💌
                </div>

                <h2>
                    ${escapeHTML(
                        letter.title
                    )}
                </h2>

                <div class="letter-detail-meta">
                    From ${escapeHTML(
                        getPersonName(
                            letter.sender_id
                        )
                    )}
                    ·
                    To ${escapeHTML(
                        getPersonName(
                            letter.recipient_id
                        )
                    )}
                </div>

                <div class="letter-detail-content">
                    ${escapeHTML(
                        letter.content
                    )}
                </div>

            `;


            letterDetailModal.classList.add(
                "active"
            );
        }


        // ==========================================
        // CREATE LETTER
        // ==========================================

        createLetterButton.addEventListener(
            "click",
            async () => {

                await loadMembers();

                letterModal.classList.add(
                    "active"
                );

            }
        );


        // ==========================================
        // CLOSE CREATE MODAL
        // ==========================================

        closeLetterModal.addEventListener(
            "click",
            () => {

                letterModal.classList.remove(
                    "active"
                );

            }
        );


        // ==========================================
        // CLOSE DETAIL
        // ==========================================

        closeLetterDetail.addEventListener(
            "click",
            () => {

                letterDetailModal.classList.remove(
                    "active"
                );

            }
        );


        // ==========================================
        // CREATE LETTER SUBMIT
        // ==========================================

        letterForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                if (!currentUser) {

                    alert(
                        "You are not logged in."
                    );

                    return;
                }


                const recipientId =
                    letterRecipient.value;

                const title =
                    letterTitle.value.trim();

                const content =
                    letterContent.value.trim();


                if (
                    !recipientId ||
                    !title ||
                    !content
                ) {

                    alert(
                        "Please complete the letter."
                    );

                    return;
                }


                const button =
                    letterForm.querySelector(
                        'button[type="submit"]'
                    );


                button.disabled = true;

                button.textContent =
                    "Saving...";


                try {

                    // ==================================
                    // GET UNIVERSE
                    // ==================================

                    const {
                        data: universeId,
                        error: universeError
                    } =
                        await supabaseClient
                            .rpc(
                                "get_my_universe_id"
                            );


                    if (universeError) {

                        throw universeError;

                    }


                    // ==================================
                    // INSERT
                    // ==================================

                    const {
                        error
                    } =
                        await supabaseClient
                            .from("letters")
                            .insert({

                                universe_id:
                                    universeId,

                                sender_id:
                                    currentUser.id,

                                recipient_id:
                                    recipientId,

                                title:
                                    title,

                                content:
                                    content

                            });


                    if (error) {

                        throw error;

                    }


                    letterForm.reset();

                    letterModal.classList.remove(
                        "active"
                    );


                    alert(
                        "Letter saved 💌"
                    );


                    await loadLetters();


                } catch (error) {

                    console.error(
                        "Create letter error:",
                        error
                    );

                    alert(
                        "Failed to save letter."
                    );

                } finally {

                    button.disabled = false;

                    button.textContent =
                        "Save Letter ✦";

                }

            }
        );


        // ==========================================
        // SECURITY HELPER
        // ==========================================

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }


            return String(value)
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );
        }


        // ==========================================
        // START
        // ==========================================

        async function initLetters() {

            await getCurrentUser();

            await loadLetters();

        }


        initLetters();

    </script>

</body>
</html>
