<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Our Letters — Our Little Universe
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ==========================================
           PAGE
        ========================================== */

        .letters-page {
            min-height: 100vh;

            padding:
                130px
                25px
                80px;
        }


        .letters-header {
            text-align: center;

            margin-bottom: 40px;
        }


        .letters-header h1 {
            margin: 0 0 12px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 46px;

            font-weight: 400;

            color: #f4f1ff;
        }


        .letters-header p {
            margin: 0;

            color: #aaa5bd;

            font-size: 15px;
        }


        /* ==========================================
           CREATE BUTTON
        ========================================== */

        .letter-create-button {

            display: block;

            margin:
                0
                auto
                50px;

            border: none;

            border-radius: 999px;

            padding:
                14px
                27px;

            background:
                linear-gradient(
                    135deg,
                    #7074db,
                    #9464d0
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0
                10px
                30px
                rgba(
                    90,
                    75,
                    190,
                    0.22
                );

            transition:
                transform
                0.2s ease,
                box-shadow
                0.2s ease;
        }


        .letter-create-button:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0
                14px
                35px
                rgba(
                    90,
                    75,
                    190,
                    0.30
                );
        }


        /* ==========================================
           LETTERS CONTAINER
        ========================================== */

        .letters-container {

            max-width:
                1000px;

            margin:
                0
                auto;

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 25px;
        }


        /* ==========================================
           LETTER CARD
        ========================================== */

        .letter-card {

            position: relative;

            padding: 28px;

            min-height: 220px;

            box-sizing: border-box;

            border-radius: 23px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.045
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            cursor: pointer;

            transition:
                transform
                0.25s ease,
                border-color
                0.25s ease,
                background
                0.25s ease;
        }


        .letter-card:hover {

            transform:
                translateY(-5px);

            border-color:
                rgba(
                    145,
                    130,
                    255,
                    0.40
                );

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.065
                );
        }


        .letter-envelope {

            font-size: 31px;

            margin-bottom: 15px;
        }


        .letter-to {

            margin-bottom: 7px;

            color:
                #a29aff;

            font-size: 11px;

            font-weight: 600;

            letter-spacing:
                1.4px;

            text-transform:
                uppercase;
        }


        .letter-title {

            margin:
                0
                0
                12px;

            color:
                #f2effa;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 25px;

            font-weight: 400;
        }


        .letter-preview {

            color:
                #aaa7b7;

            font-size: 14px;

            line-height: 1.7;

            display:
                -webkit-box;

            -webkit-line-clamp: 3;

            -webkit-box-orient:
                vertical;

            overflow: hidden;
        }


        .letter-from {

            margin-top: 20px;

            color:
                #817d92;

            font-size: 13px;
        }


        /* ==========================================
           EMPTY STATE
        ========================================== */

        .letters-empty {

            grid-column:
                1 / -1;

            text-align:
                center;

            padding:
                70px
                20px;

            color:
                #9995aa;
        }


        /* ==========================================
           MODAL
        ========================================== */

        .letter-modal {

            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            box-sizing: border-box;

            background:
                rgba(
                    5,
                    5,
                    20,
                    0.80
                );

            backdrop-filter:
                blur(9px);

            -webkit-backdrop-filter:
                blur(9px);
        }


        .letter-modal.active {

            display: flex;
        }


        .letter-box {

            position: relative;

            width:
                min(
                    820px,
                    100%
                );

            max-height:
                88vh;

            overflow-y:
                auto;

            box-sizing:
                border-box;

            padding:
                34px;

            border-radius:
                25px;

            background:
                #18172f;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            box-shadow:
                0
                30px
                90px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );
        }


        .letter-close {

            position: absolute;

            top: 16px;

            right: 20px;

            z-index: 5;

            width: 35px;

            height: 35px;

            border: none;

            background:
                transparent;

            color:
                #aaa;

            font-size:
                29px;

            line-height: 1;

            cursor: pointer;
        }


        .letter-close:hover {

            color: white;
        }


        /* ==========================================
           FORM
        ========================================== */

        .letter-form {

            display: flex;

            flex-direction:
                column;

            gap: 10px;
        }


        .letter-form h2 {

            margin:
                0
                0
                15px;

            color:
                #f4f1ff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                32px;

            font-weight:
                400;
        }


        .letter-form label {

            margin-top:
                9px;

            color:
                #aaa6b9;

            font-size:
                14px;
        }


        .letter-form select,
        .letter-form input,
        .letter-form textarea {

            width: 100%;

            box-sizing:
                border-box;

            padding:
                13px
                15px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.11
                );

            border-radius:
                11px;

            outline:
                none;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.055
                );

            color:
                #eee;

            font-family:
                inherit;

            font-size:
                14px;
        }


        .letter-form select:focus,
        .letter-form input:focus,
        .letter-form textarea:focus {

            border-color:
                #8175df;
        }


        .letter-form select option {

            background:
                #211f3a;

            color:
                white;
        }


        .letter-form textarea {

            min-height:
                250px;

            resize:
                vertical;

            line-height:
                1.7;
        }


        .letter-save-button {

            width: 100%;

            margin-top:
                18px;

            border:
                none;

            border-radius:
                999px;

            padding:
                15px
                20px;

            background:
                linear-gradient(
                    135deg,
                    #7074db,
                    #9665d0
                );

            color:
                white;

            font-size:
                15px;

            font-weight:
                600;

            cursor:
                pointer;

            transition:
                transform
                0.2s ease,
                opacity
                0.2s ease;
        }


        .letter-save-button:hover {

            transform:
                translateY(-2px);
        }


        .letter-save-button:disabled {

            opacity:
                0.5;

            cursor:
                not-allowed;

            transform:
                none;
        }


        /* ==========================================
           LETTER DETAIL
        ========================================== */

        .letter-detail-content {

            max-width:
                720px;

            margin:
                0
                auto;

            text-align:
                center;
        }


        .letter-detail-content
        .letter-envelope {

            font-size:
                48px;

            margin-bottom:
                20px;
        }


        .letter-detail-content h2 {

            margin:
                0
                0
                15px;

            color:
                #f4f1ff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                38px;

            font-weight:
                400;
        }


        .letter-detail-meta {

            margin-bottom:
                30px;

            color:
                #928da5;

            font-size:
                13px;

            line-height:
                1.7;
        }


        .letter-detail-body {

            text-align:
                left;

            padding:
                28px;

            border-radius:
                18px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.035
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.07
                );

            color:
                #d5d1df;

            font-size:
                15px;

            line-height:
                1.9;

            white-space:
                pre-wrap;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 700px) {

            .letters-page {

                padding:
                    120px
                    18px
                    60px;
            }


            .letters-header h1 {

                font-size:
                    35px;
            }


            .letters-container {

                grid-template-columns:
                    1fr;
            }


            .letter-box {

                padding:
                    25px;

                max-height:
                    90vh;
            }


            .letter-form h2 {

                font-size:
                    28px;
            }


            .letter-detail-content h2 {

                font-size:
                    30px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         NAVBAR
    ========================================== -->

    <nav class="navbar">

        <div class="logo">
            Our Little Universe ✦
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="memories.html">
                Memories
            </a>

            <a href="timeline.html">
                Timeline
            </a>

            <a
                href="letters.html"
                class="active"
            >
                Letters
            </a>

        </div>


        <button
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </nav>



    <!-- ==========================================
         MAIN
    ========================================== -->

    <main class="letters-page">


        <header class="letters-header">

            <h1>
                Our Letters 💌
            </h1>

            <p>
                little words we want to keep forever
            </p>

        </header>


        <button
            type="button"
            id="createLetterButton"
            class="letter-create-button"
        >
            + Write a Letter
        </button>


        <!-- LETTER LIST -->

        <section
            id="lettersContainer"
            class="letters-container"
        >

            <div class="letters-empty">
                Loading our letters...
            </div>

        </section>


    </main>



    <!-- ==========================================
         WRITE LETTER MODAL
    ========================================== -->

    <div
        id="letterModal"
        class="letter-modal"
    >

        <div class="letter-box">


            <button
                type="button"
                id="closeLetterModal"
                class="letter-close"
            >
                ×
            </button>


            <form
                id="letterForm"
                class="letter-form"
            >

                <h2>
                    Write a Letter 💌
                </h2>


                <label
                    for="letterRecipient"
                >
                    To
                </label>


                <select
                    id="letterRecipient"
                    required
                >

                    <option value="">
                        Choose someone...
                    </option>

                </select>


                <label
                    for="letterTitle"
                >
                    Title
                </label>


                <input
                    type="text"
                    id="letterTitle"
                    placeholder="A little letter for you..."
                    required
                >


                <label
                    for="letterContent"
                >
                    Your letter
                </label>


                <textarea
                    id="letterContent"
                    placeholder="Write everything you want to say..."
                    required
                ></textarea>


                <button
                    type="submit"
                    class="letter-save-button"
                >
                    Save Letter ✦
                </button>

            </form>

        </div>

    </div>



    <!-- ==========================================
         LETTER DETAIL MODAL
    ========================================== -->

    <div
        id="letterDetailModal"
        class="letter-modal"
    >

        <div class="letter-box">


            <button
                type="button"
                id="closeLetterDetail"
                class="letter-close"
            >
                ×
            </button>


            <div
                id="letterDetailContent"
                class="letter-detail-content"
            ></div>


        </div>

    </div>



    <!-- ==========================================
         SCRIPTS
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="auth.js"></script>

    <script src="letters.js"></script>


</body>

</html>
