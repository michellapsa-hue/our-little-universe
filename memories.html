<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Memories — Our Little Universe
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =========================================
           PAGE
        ========================================= */

        .memories-page {
            min-height: 100vh;
            padding: 120px 30px 80px;
        }


        .memories-header {
            text-align: center;
            margin-bottom: 45px;
        }


        .memories-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }


        .memories-header p {
            color: #aaa;
        }


        /* =========================================
           ADD BUTTON
        ========================================= */

        .add-memory-button {
            display: block;
            margin: 0 auto 55px;

            border: none;

            padding: 15px 28px;

            border-radius: 999px;

            background: linear-gradient(
                135deg,
                #6d70d8,
                #8c61c7
            );

            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .add-memory-button:hover {
            transform: translateY(-3px);
        }


        /* =========================================
           MEMORY GRID
        ========================================= */

        .universe-menu {
            max-width: 1100px;
            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 26px;
        }


        .memory-card {
            overflow: hidden;

            border-radius: 24px;

            background: rgba(
                255,
                255,
                255,
                0.045
            );

            border: 1px solid rgba(
                255,
                255,
                255,
                0.1
            );

            cursor: pointer;

            transition: 0.25s ease;

            backdrop-filter: blur(10px);
        }


        .memory-card:hover {
            transform: translateY(-5px);

            border-color: rgba(
                145,
                130,
                255,
                0.4
            );

            background: rgba(
                255,
                255,
                255,
                0.065
            );
        }


        .memory-card-image {
            display: block;

            width: 100%;
            height: 270px;

            object-fit: cover;
        }


        .memory-card-content {
            padding: 24px;
        }


        .memory-card-date {
            font-size: 12px;

            letter-spacing: 1.5px;

            color: #9690b0;

            margin-bottom: 10px;
        }


        .memory-card-title {
            margin: 0 0 10px;

            font-family: Georgia, serif;

            font-size: 27px;

            color: #f1eff8;
        }


        .memory-card-location {
            color: #999;

            font-size: 14px;
        }


        .memory-empty {
            grid-column: 1 / -1;

            text-align: center;

            color: #aaa;

            padding: 60px 20px;
        }


        /* =========================================
           MODAL
        ========================================= */

        .memory-modal {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background: rgba(
                5,
                5,
                20,
                0.8
            );

            backdrop-filter: blur(8px);
        }


        .memory-modal.active {
            display: flex;
        }


        .memory-box {
            position: relative;

            width: min(
                620px,
                100%
            );

            max-height: 90vh;

            overflow-y: auto;

            padding: 30px;

            border-radius: 25px;

            background: #17162d;

            border: 1px solid rgba(
                255,
                255,
                255,
                0.12
            );

            box-shadow:
                0 30px 90px
                rgba(0, 0, 0, 0.5);
        }


        .memory-close {
            position: absolute;

            top: 12px;
            right: 17px;

            border: none;

            background: transparent;

            color: #aaa;

            font-size: 30px;

            cursor: pointer;

            z-index: 2;
        }


        /* =========================================
           DETAIL
        ========================================= */

        .memory-detail-image {
            display: block;

            width: 100%;

            max-height: 380px;

            object-fit: cover;

            border-radius: 18px;

            margin-bottom: 25px;
        }


        .memory-detail-date {
            color: #9189b0;

            font-size: 12px;

            letter-spacing: 1.5px;

            margin-bottom: 10px;
        }


        .memory-detail-title {
            font-family: Georgia, serif;

            font-size: 34px;

            margin: 0 0 10px;
        }


        .memory-detail-location {
            color: #999;

            margin-bottom: 22px;
        }


        .memory-detail-story {
            color: #d0cdd9;

            line-height: 1.8;

            white-space: pre-wrap;
        }


        /* =========================================
           ACTION BUTTONS
        ========================================= */

        .memory-detail-actions {
            display: flex;

            gap: 12px;

            margin-top: 30px;

            flex-wrap: wrap;
        }


        .memory-edit-button,
        .memory-delete-button {
            border: none;

            padding: 12px 20px;

            border-radius: 999px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .memory-edit-button {
            background: linear-gradient(
                135deg,
                #7074db,
                #8c62c7
            );

            color: white;
        }


        .memory-delete-button {
            background: rgba(
                190,
                70,
                100,
                0.16
            );

            color: #ff9aae;
        }


        .memory-edit-button:hover,
        .memory-delete-button:hover {
            transform: translateY(-2px);
        }


        /* =========================================
           FORM
        ========================================= */

        .memory-form {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .memory-form label {
            color: #aaa;

            font-size: 13px;

            margin-top: 8px;
        }


        .memory-form input,
        .memory-form textarea {
            width: 100%;

            box-sizing: border-box;

            padding: 12px 14px;

            border-radius: 10px;

            border: 1px solid rgba(
                255,
                255,
                255,
                0.12
            );

            background: rgba(
                255,
                255,
                255,
                0.05
            );

            color: white;

            font-family: inherit;

            outline: none;
        }


        .memory-form textarea {
            resize: vertical;

            min-height: 150px;
        }


        .memory-form input:focus,
        .memory-form textarea:focus {
            border-color: #8174dc;
        }


        .memory-save-button {
            margin-top: 15px;

            border: none;

            padding: 13px 20px;

            border-radius: 999px;

            background: linear-gradient(
                135deg,
                #7074db,
                #8c62c7
            );

            color: white;

            font-weight: 600;

            cursor: pointer;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .memories-page {
                padding: 100px 18px 60px;
            }

            .memories-header h1 {
                font-size: 34px;
            }

            .memory-box {
                padding: 24px;
            }

            .memory-detail-title {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">
            Our Little Universe ✦
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a
                href="memories.html"
                class="active"
            >
                Memories
            </a>

            <a href="timeline.html">
                Timeline
            </a>

            <a href="letters.html">
                Letters
            </a>

        </div>


        <button
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </nav>



    <!-- =========================================
         PAGE
    ========================================= -->

    <main class="memories-page">


        <header class="memories-header">

            <h1>
                Our Memories ✦
            </h1>

            <p>
                little moments we never want to forget
            </p>

        </header>



        <button
            id="addMemoryButton"
            class="add-memory-button"
        >
            + Add Memory
        </button>



        <section
            id="memoryContainer"
            class="universe-menu"
        >

            <div class="memory-empty">
                Loading our memories...
            </div>

        </section>


    </main>



    <!-- =========================================
         ADD MEMORY MODAL
    ========================================= -->

    <div
        id="addMemoryModal"
        class="memory-modal"
    >

        <div class="memory-box">

            <button
                type="button"
                id="closeMemoryModal"
                class="memory-close"
            >
                ×
            </button>


            <h2>
                Add a Memory ✦
            </h2>


            <form
                id="memoryForm"
                class="memory-form"
            >

                <label>
                    Title
                </label>

                <input
                    type="text"
                    id="memoryTitle"
                    placeholder="Our little moment..."
                    required
                >


                <label>
                    Date
                </label>

                <input
                    type="date"
                    id="memoryDate"
                >


                <label>
                    Location
                </label>

                <input
                    type="text"
                    id="memoryLocation"
                    placeholder="Where did it happen?"
                >


                <label>
                    Photo
                </label>

                <input
                    type="file"
                    id="memoryPhoto"
                    accept="image/*"
                >


                <label>
                    Story
                </label>

                <textarea
                    id="memoryDescription"
                    placeholder="Tell the story..."
                ></textarea>


                <button
                    type="submit"
                    class="memory-save-button"
                >
                    Save Memory ✦
                </button>

            </form>

        </div>

    </div>



    <!-- =========================================
         DETAIL MODAL
    ========================================= -->

    <div
        id="memoryDetailModal"
        class="memory-modal"
    >

        <div class="memory-box">

            <button
                type="button"
                id="closeMemoryDetail"
                class="memory-close"
            >
                ×
            </button>


            <div id="memoryDetailContent"></div>

        </div>

    </div>



    <!-- =========================================
         SCRIPTS
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="auth.js"></script>

    <script src="memories.js"></script>


</body>

</html>
