<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Memories — Our Little Universe
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =========================================
           PAGE
        ========================================= */

        .memories-page {
            min-height: 100vh;
            padding: 130px 30px 80px;
        }

        .memories-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .memories-header h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 44px;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .memories-header p {
            color: #aaa5bd;
            font-size: 15px;
        }


        /* =========================================
           ADD BUTTON
        ========================================= */

        .add-memory-button {
            display: block;
            margin: 0 auto 55px;

            border: none;
            border-radius: 999px;

            padding: 15px 28px;

            background:
                linear-gradient(
                    135deg,
                    #6d70d8,
                    #8c61c7
                );

            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 10px 30px
                rgba(80, 70, 180, 0.25);

            transition: 0.2s ease;
        }

        .add-memory-button:hover {
            transform: translateY(-3px);
        }


        /* =========================================
           MEMORY GRID
        ========================================= */

        .universe-menu {
            max-width: 1100px;
            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 26px;
        }


        /* =========================================
           MEMORY CARD
        ========================================= */

        .memory-card {
            overflow: hidden;

            border-radius: 24px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.045
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            cursor: pointer;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease;
        }

        .memory-card:hover {
            transform: translateY(-5px);

            border-color:
                rgba(
                    145,
                    130,
                    255,
                    0.40
                );

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.065
                );
        }

        .memory-card-image {
            display: block;

            width: 100%;
            height: 270px;

            object-fit: cover;
        }

        .memory-card-content {
            padding: 24px;
        }

        .memory-card-date {
            color: #9690b0;

            font-size: 12px;

            letter-spacing: 1.5px;

            margin-bottom: 10px;
        }

        .memory-card-title {
            margin: 0 0 10px;

            color: #f1eff8;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 27px;

            font-weight: 400;
        }

        .memory-card-location {
            color: #999;

            font-size: 14px;
        }

        .memory-empty {
            grid-column: 1 / -1;

            text-align: center;

            color: #aaa;

            padding: 70px 20px;
        }


        /* =========================================
           MODAL
        ========================================= */

        .memory-modal {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(
                    5,
                    5,
                    20,
                    0.82
                );

            backdrop-filter:
                blur(8px);
        }

        .memory-modal.active {
            display: flex;
        }

        .memory-box {
            position: relative;

            width: min(
                620px,
                100%
            );

            max-height: 90vh;

            overflow-y: auto;

            padding: 30px;

            border-radius: 25px;

            background: #17162d;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            box-shadow:
                0 30px 90px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );
        }

        .memory-close {
            position: absolute;

            top: 10px;
            right: 16px;

            z-index: 5;

            border: none;

            background: transparent;

            color: #aaa;

            font-size: 31px;

            line-height: 1;

            cursor: pointer;
        }

        .memory-close:hover {
            color: white;
        }


        /* =========================================
           DETAIL
        ========================================= */

        .memory-detail-image {
            display: block;

            width: 100%;

            max-height: 380px;

            object-fit: cover;

            border-radius: 18px;

            margin-bottom: 25px;
        }

        .memory-detail-date {
            color: #9189b0;

            font-size: 12px;

            letter-spacing: 1.5px;

            margin-bottom: 10px;
        }

        .memory-detail-title {
            margin: 0 0 10px;

            color: #f4f1ff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 36px;

            font-weight: 400;
        }

        .memory-detail-location {
            color: #999;

            font-size: 14px;

            margin-bottom: 22px;
        }

        .memory-detail-story {
            color: #d0cdd9;

            line-height: 1.8;

            white-space: pre-wrap;
        }


        /* =========================================
           ACTION BUTTONS
        ========================================= */

        .memory-detail-actions {
            display: flex;

            gap: 12px;

            margin-top: 30px;

            flex-wrap: wrap;
        }

        .memory-edit-button,
        .memory-delete-button {
            border: none;

            border-radius: 999px;

            padding: 12px 20px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .memory-edit-button {
            background:
                linear-gradient(
                    135deg,
                    #7074db,
                    #8c62c7
                );

            color: white;
        }

        .memory-delete-button {
            background:
                rgba(
                    190,
                    70,
                    100,
                    0.16
                );

            color: #ff9aae;
        }

        .memory-edit-button:hover,
        .memory-delete-button:hover {
            transform: translateY(-2px);
        }

        .memory-edit-button:disabled,
        .memory-delete-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================
           FORM
        ========================================= */

        .memory-form {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .memory-form h2 {
            margin-bottom: 10px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-weight: 400;
        }

        .memory-form label {
            margin-top: 8px;

            color: #aaa;

            font-size: 13px;
        }

        .memory-form input,
        .memory-form textarea {
            width: 100%;

            padding: 12px 14px;

            box-sizing: border-box;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-radius: 10px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            color: white;

            font-family: inherit;

            outline: none;
        }

        .memory-form textarea {
            min-height: 150px;

            resize: vertical;
        }

        .memory-form input:focus,
        .memory-form textarea:focus {
            border-color: #8174dc;
        }

        .memory-save-button {
            margin-top: 15px;

            border: none;

            border-radius: 999px;

            padding: 13px 20px;

            background:
                linear-gradient(
                    135deg,
                    #7074db,
                    #8c62c7
                );

            color: white;

            font-weight: 600;

            cursor: pointer;
        }

        .memory-save-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .memories-page {
                padding:
                    120px
                    18px
                    60px;
            }

            .memories-header h1 {
                font-size: 34px;
            }

            .memory-box {
                padding: 24px;
            }

            .memory-detail-title {
                font-size: 29px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">
            Our Little Universe ✦
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a
                href="memories.html"
                class="active"
            >
                Memories
            </a>

            <a href="timeline.html">
                Timeline
            </a>

            <a href="letters.html">
                Letters
            </a>

        </div>

        <button
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </nav>



    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="memories-page">


        <header class="memories-header">

            <h1>
                Our Memories ✦
            </h1>

            <p>
                little moments we never want to forget
            </p>

        </header>


        <button
            id="addMemoryButton"
            class="add-memory-button"
        >
            + Add Memory
        </button>


        <section
            id="memoryContainer"
            class="universe-menu"
        >

            <div class="memory-empty">
                Loading our memories...
            </div>

        </section>


    </main>



    <!-- =========================================
         ADD MEMORY MODAL
    ========================================= -->

    <div
        id="addMemoryModal"
        class="memory-modal"
    >

        <div class="memory-box">

            <button
                type="button"
                id="closeMemoryModal"
                class="memory-close"
            >
                ×
            </button>


            <form
                id="memoryForm"
                class="memory-form"
            >

                <h2>
                    Add a Memory ✦
                </h2>


                <label for="memoryTitle">
                    Title
                </label>

                <input
                    type="text"
                    id="memoryTitle"
                    placeholder="Our little moment..."
                    required
                >


                <label for="memoryDate">
                    Date
                </label>

                <input
                    type="date"
                    id="memoryDate"
                >


                <label for="memoryLocation">
                    Location
                </label>

                <input
                    type="text"
                    id="memoryLocation"
                    placeholder="Where did it happen?"
                >


                <label for="memoryPhoto">
                    Photo
                </label>

                <input
                    type="file"
                    id="memoryPhoto"
                    accept="image/*"
                >


                <label for="memoryDescription">
                    Story
                </label>

                <textarea
                    id="memoryDescription"
                    placeholder="Tell the story..."
                ></textarea>


                <button
                    type="submit"
                    class="memory-save-button"
                >
                    Save Memory ✦
                </button>

            </form>

        </div>

    </div>



    <!-- =========================================
         DETAIL MODAL
    ========================================= -->

    <div
        id="memoryDetailModal"
        class="memory-modal"
    >

        <div class="memory-box">

            <button
                type="button"
                id="closeMemoryDetail"
                class="memory-close"
            >
                ×
            </button>


            <!--
                IMPORTANT:
                Detail content and action buttons
                are separated.
            -->

            <div id="memoryDetailContent"></div>


            <div
                id="memoryDetailActions"
                class="memory-detail-actions"
            >

                <button
                    type="button"
                    id="editMemoryButton"
                    class="memory-edit-button"
                >
                    ✎ Edit Memory
                </button>


                <button
                    type="button"
                    id="deleteMemoryButton"
                    class="memory-delete-button"
                >
                    🗑 Delete
                </button>

            </div>

        </div>

    </div>



    <!-- =========================================
         SCRIPTS
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="auth.js"></script>

    <script src="memories.js"></script>


</body>

</html>
